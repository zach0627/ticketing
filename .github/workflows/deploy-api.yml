# API 部署到 Azure App Service Linux（F1）。
#
# 跟前端一樣：CI 成功之後才跑，而且用 `DEPLOY_ENABLED` 當總開關。
#
# 認證用 **OIDC federated credential**，不是長期的 publish profile——
# 那種檔案外洩等於把整個 Web App 交出去，而且沒有到期日（設計文件 16 第 8 節）。
#
# 要啟用的話：
#   gh variable set DEPLOY_ENABLED --body true
#   gh variable set AZURE_WEBAPP_NAME --body YOUR-WEBAPP-NAME
#   gh secret set AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID
name: Deploy API

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # OIDC 要這個才能跟 Azure 換 token

jobs:
  deploy:
    if: >
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          dotnet publish src/Ticketing.Api/Ticketing.Api.csproj -c Release \
            -r linux-x64 --self-contained false -p:UseAppHost=false \
            -o artifacts/api

      - name: Sanity check the artifact
        run: |
          # zip 的根目錄必須直接是這些檔案，不能多包一層資料夾
          test -f artifacts/api/Ticketing.Api.dll
          test -f artifacts/api/Ticketing.Api.runtimeconfig.json
          test -f artifacts/api/appsettings.Production.json

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: artifacts/api

      - name: Smoke test
        run: |
          # F1 沒有 slot，部署後會有短暫中斷 ＋ 冷啟動，所以要等
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" || true)
            echo "attempt $attempt: $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "健康檢查在 5 分鐘內沒有回 200"
          exit 1
